title = "researchclaweval-arena custom rules"

[extend]
useDefault = true

[[rules]]
id = "openai-sk-style"
description = "OpenAI-style secret"
regex = '''sk-[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "github-token"
description = "GitHub PAT / OAuth"
regex = '''gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{30,}'''

[[rules]]
id = "private-key-block"
description = "Encoded private key"
regex = '''-----BEGIN (RSA |OPENSSH |EC |DSA |ENCRYPTED )?PRIVATE KEY-----'''

[[rules]]
id = "jwt-bearer"
description = "JWT"
regex = '''eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'''

[[rules]]
id = "credential-assignment"
description = "Credential-like assignment with value"
regex = '''(api[_-]?key|token|secret|password|bearer)\s*[:=]\s*["'][^"']{12,}["']'''