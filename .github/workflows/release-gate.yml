name: release-gate
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: allowlist + pattern scan
        run: bash scripts/check-release.sh

      - name: gitleaks (pinned binary, run step — no action license)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o /tmp/g.tgz
          tar -xzf /tmp/g.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config scripts/gitleaks.toml --log-opts=--all --redact

      - name: smoke tests
        run: |
          python3 -m py_compile scoring/*.py
          bash -n scripts/*.sh scripts/runner/*.sh
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('schemas/*.json')+glob.glob('scoring/*.json')+glob.glob('templates/**/*.json',recursive=True)]"
          bash scripts/check-release.sh --path templates
          bash scripts/check-release.sh --path schemas
          python3 tests/test_release_safety.py